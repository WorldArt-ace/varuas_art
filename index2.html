<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LUMIÈRE | Checkout Demo</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@600;700&family=Montserrat:wght@300;400;500;600&display=swap" rel="stylesheet">
<script src="https://unpkg.com/@phosphor-icons/web"></script>

<style>
:root{
--dark:#1a1a1a;
--gold:#c6a87c;
--gray:#eee;
--transition:all .3s ease;
}

*{margin:0;padding:0;box-sizing:border-box}
body{font-family:Montserrat,sans-serif;color:#111}

header{
position:fixed;top:0;width:100%;background:#fff;
box-shadow:0 5px 20px rgba(0,0,0,.05);z-index:1000
}
.container{width:90%;max-width:1200px;margin:auto}
.nav{height:80px;display:flex;justify-content:space-between;align-items:center}
.logo{font-family:Cormorant Garamond,serif;font-size:1.8rem}
.cart-icon{position:relative;cursor:pointer;font-size:1.4rem}
.cart-count{
position:absolute;top:-8px;right:-8px;
background:var(--gold);color:#fff;
width:16px;height:16px;font-size:10px;
border-radius:50%;display:flex;align-items:center;justify-content:center
}

/* HERO */
.hero{
height:100vh;
background:url("https://images.unsplash.com/photo-1618221195710-dd6b41faaea6") center/cover;
display:flex;align-items:center;justify-content:center;color:#fff;text-align:center
}
.hero h1{font-size:3.5rem}

/* PRODUCTS */
.products{padding:100px 0}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:30px}
.card img{width:100%;height:320px;object-fit:cover}
.card button{
width:100%;padding:15px;
border:none;background:#fff;font-weight:600;cursor:pointer
}

/* CART */
.overlay{
position:fixed;inset:0;background:rgba(0,0,0,.4);
opacity:0;visibility:hidden;transition:.3s;z-index:2000
}
.overlay.active{opacity:1;visibility:visible}

.cart{
position:fixed;top:0;right:-420px;width:400px;height:100vh;
background:#fff;transition:.3s;z-index:2001;
display:flex;flex-direction:column
}
.cart.active{right:0}

.cart-header,.cart-footer{padding:20px;border-bottom:1px solid #eee}
.cart-items{flex:1;overflow:auto;padding:20px}
.cart-item{display:flex;gap:12px;margin-bottom:20px}
.cart-item img{width:70px;height:80px;object-fit:cover}

.qty button{width:24px;height:24px}

/* PROMO */
.promo{display:flex;gap:10px;margin-bottom:15px}
.promo input{flex:1;padding:10px;border:1px solid #ccc}
.promo button{padding:10px;background:#111;color:#fff;border:none}

/* CHECKOUT */
.checkout{
padding:20px;border-top:1px solid #eee
}
.payment-methods label{
display:flex;gap:10px;margin-bottom:10px;cursor:pointer
}

.pay-btn{
width:100%;padding:15px;
background:#1a1a1a;color:#fff;border:none;font-size:1rem
}
</style>
</head>

<body>

<header>
<div class="container nav">
<div class="logo">LUMIÈRE.</div>
<div class="cart-icon" onclick="openCart()">
<i class="ph ph-shopping-bag"></i>
<span class="cart-count" id="cartCount">0</span>
</div>
</div>
</header>

<section class="hero">
<div>
<h1>Modern Artisan Decor</h1>
<p>Checkout Demo with Payments</p>
</div>
</section>

<section class="products container">
<div class="grid">

<div class="card">
<img src="https://images.unsplash.com/photo-1610701596007-11502861dcfa">
<button onclick="addToCart({id:1,name:'Oslo Vase',price:45,image:this.previousElementSibling.src})">
Add to Cart
</button>
</div>

<div class="card">
<img src="https://images.unsplash.com/photo-1579725942955-4d83dd756180">
<button onclick="addToCart({id:2,name:'Aura Lamp',price:120,image:this.previousElementSibling.src})">
Add to Cart
</button>
</div>

</div>
</section>

<!-- CART -->
<div class="overlay" id="overlay" onclick="closeCart()"></div>

<div class="cart" id="cart">
<div class="cart-header">
<strong>Your Cart</strong>
<button onclick="closeCart()">✕</button>
</div>

<div class="cart-items" id="cartItems"></div>

<div class="cart-footer">

<div class="promo">
<input type="text" id="promoInput" placeholder="Promo code">
<button onclick="applyPromo()">Apply</button>
</div>

<div style="display:flex;justify-content:space-between">
<span>Total</span>
<strong id="total">$0.00</strong>
</div>

<div class="checkout">
<h4>Payment Method</h4>
<div class="payment-methods">
<label><input type="radio" name="pay" checked> Credit / Debit Card</label>
<label><input type="radio" name="pay"> UPI / Online</label>
<label><input type="radio" name="pay"> Cash on Delivery</label>
</div>
<button class="pay-btn" onclick="payNow()">Pay Now</button>
</div>

</div>
</div>

<script>
const cartEl=document.getElementById("cart");
const overlay=document.getElementById("overlay");
const itemsEl=document.getElementById("cartItems");
const totalEl=document.getElementById("total");
const countEl=document.getElementById("cartCount");

let cart=JSON.parse(localStorage.getItem("cart"))||[];
let discount=0;

function openCart(){cartEl.classList.add("active");overlay.classList.add("active")}
function closeCart(){cartEl.classList.remove("active");overlay.classList.remove("active")}

function addToCart(p){
let i=cart.find(x=>x.id===p.id);
i?i.qty++:cart.push({...p,qty:1});
save();
}

function changeQty(id,a){
cart=cart.map(i=>{if(i.id===id)i.qty+=a;return i}).filter(i=>i.qty>0);
save();
}

function applyPromo(){
const code=document.getElementById("promoInput").value;
if(code==="LUMIERE10"){discount=0.1;alert("10% discount applied")}
else{discount=0;alert("Invalid promo code")}
render();
}

function payNow(){
alert("Payment gateway integration goes here 🚀");
}

function save(){
localStorage.setItem("cart",JSON.stringify(cart));
render();
}

function render(){
itemsEl.innerHTML="";
let total=0,count=0;

cart.forEach(i=>{
total+=i.price*i.qty;
count+=i.qty;
itemsEl.innerHTML+=`
<div class="cart-item">
<img src="${i.image}">
<div>
<strong>${i.name}</strong><br>
$${i.price}
<div class="qty">
<button onclick="changeQty(${i.id},-1)">−</button>
${i.qty}
<button onclick="changeQty(${i.id},1)">+</button>
</div>
</div>
</div>`;
});

total=total-(total*discount);
totalEl.textContent="$"+total.toFixed(2);
countEl.textContent=count;
}

render();
</script>

</body>
</html>
