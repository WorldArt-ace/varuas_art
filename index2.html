<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lumina Gallery — Discover Beautiful Photography</title>
    <meta name="description" content="Lumina Gallery — a premium, curated collection of breathtaking photography spanning nature, architecture, abstract art, and more.">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Playfair+Display:wght@700;800&display=swap" rel="stylesheet">
    <style>
        /* =============================================
           DESIGN TOKENS & RESET
        ============================================= */
        :root {
            --bg-deep:       #0d0f14;
            --bg-mid:        #13161e;
            --bg-card:       #1a1d27;
            --bg-card-hover: #1f2235;
            --glass-bg:      rgba(255,255,255,0.04);
            --glass-border:  rgba(255,255,255,0.09);
            --accent-1:      #a78bfa;   /* violet */
            --accent-2:      #60a5fa;   /* blue   */
            --accent-3:      #f472b6;   /* pink   */
            --text-primary:  #f1f5f9;
            --text-muted:    #64748b;
            --text-sub:      #94a3b8;
            --save-red:      #e60023;
            --save-red-h:    #ad081b;
            --radius-card:   18px;
            --shadow-card:   0 8px 30px rgba(0,0,0,0.4);
            --transition:    0.35s cubic-bezier(0.4, 0, 0.2, 1);
        }
        *, *::before, *::after {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        html { scroll-behavior: smooth; }
        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--bg-deep);
            color: var(--text-primary);
            min-height: 100vh;
            overflow-x: hidden;
        }
        /* =============================================
           ANIMATED GRADIENT BACKGROUND
        ============================================= */
        .bg-canvas {
            position: fixed;
            inset: 0;
            z-index: 0;
            overflow: hidden;
            pointer-events: none;
        }
        .bg-canvas::before {
            content: '';
            position: absolute;
            width: 900px; height: 900px;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(167,139,250,0.18) 0%, transparent 70%);
            top: -300px; left: -200px;
            animation: drift1 18s ease-in-out infinite alternate;
        }
        .bg-canvas::after {
            content: '';
            position: absolute;
            width: 700px; height: 700px;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(96,165,250,0.15) 0%, transparent 70%);
            bottom: -200px; right: -150px;
            animation: drift2 22s ease-in-out infinite alternate;
        }
        .bg-orb {
            position: absolute;
            width: 600px; height: 600px;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(244,114,182,0.12) 0%, transparent 70%);
            top: 40%; left: 50%;
            transform: translate(-50%, -50%);
            animation: drift3 26s ease-in-out infinite alternate;
        }
        @keyframes drift1 {
            from { transform: translate(0, 0) scale(1); }
            to   { transform: translate(80px, 60px) scale(1.15); }
        }
        @keyframes drift2 {
            from { transform: translate(0, 0) scale(1); }
            to   { transform: translate(-70px, -50px) scale(1.2); }
        }
        @keyframes drift3 {
            from { transform: translate(-50%, -50%) scale(0.9); }
            to   { transform: translate(-45%, -55%) scale(1.1); }
        }
        /* =============================================
           PAGE WRAPPER
        ============================================= */
        .page-wrapper {
            position: relative;
            z-index: 1;
            padding: 0 24px 80px;
        }
        /* =============================================
           HERO / HEADER
        ============================================= */
        .hero {
            max-width: 1400px;
            margin: 0 auto;
            padding: 80px 0 56px;
            text-align: center;
        }
        .hero-eyebrow {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            background: var(--glass-bg);
            border: 1px solid var(--glass-border);
            border-radius: 100px;
            padding: 6px 16px;
            font-size: 0.78rem;
            font-weight: 600;
            letter-spacing: 0.12em;
            text-transform: uppercase;
            color: var(--accent-1);
            margin-bottom: 28px;
            backdrop-filter: blur(10px);
            animation: fadeUp 0.7s ease both;
        }
        .hero-eyebrow::before {
            content: '';
            width: 6px; height: 6px;
            border-radius: 50%;
            background: var(--accent-1);
            box-shadow: 0 0 8px var(--accent-1);
            animation: pulse 2s ease infinite;
        }
        @keyframes pulse {
            0%, 100% { opacity: 1; transform: scale(1); }
            50%       { opacity: 0.5; transform: scale(1.4); }
        }
        .hero-title {
            font-family: 'Playfair Display', serif;
            font-size: clamp(2.8rem, 6vw, 5rem);
            font-weight: 800;
            line-height: 1.1;
            letter-spacing: -0.02em;
            background: linear-gradient(135deg, #f1f5f9 20%, var(--accent-1) 50%, var(--accent-2) 80%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-bottom: 20px;
            animation: fadeUp 0.7s 0.1s ease both;
        }
        .hero-sub {
            font-size: 1.1rem;
            color: var(--text-sub);
            max-width: 520px;
            margin: 0 auto 48px;
            line-height: 1.7;
            font-weight: 400;
            animation: fadeUp 0.7s 0.2s ease both;
        }
        @keyframes fadeUp {
            from { opacity: 0; transform: translateY(24px); }
            to   { opacity: 1; transform: translateY(0); }
        }
        /* =============================================
           FILTER TABS
        ============================================= */
        .filters-wrap {
            max-width: 1400px;
            margin: 0 auto;
            display: flex;
            justify-content: center;
            animation: fadeUp 0.7s 0.3s ease both;
        }
        .filters {
            display: flex;
            gap: 10px;
            background: var(--glass-bg);
            border: 1px solid var(--glass-border);
            backdrop-filter: blur(16px);
            padding: 8px;
            border-radius: 100px;
            flex-wrap: wrap;
            justify-content: center;
            margin-bottom: 56px;
        }
        .filter-btn {
            background: transparent;
            border: none;
            color: var(--text-sub);
            font-family: 'Inter', sans-serif;
            font-size: 0.88rem;
            font-weight: 500;
            padding: 9px 22px;
            border-radius: 100px;
            cursor: pointer;
            transition: var(--transition);
            white-space: nowrap;
        }
        .filter-btn:hover {
            color: var(--text-primary);
            background: rgba(255,255,255,0.06);
        }
        .filter-btn.active {
            background: linear-gradient(135deg, var(--accent-1), var(--accent-2));
            color: #fff;
            font-weight: 600;
            box-shadow: 0 4px 20px rgba(167,139,250,0.35);
        }
        /* =============================================
           MASONRY GRID
        ============================================= */
        .masonry-grid {
            column-count: 4;
            column-gap: 20px;
            max-width: 1400px;
            margin: 0 auto;
        }
        @media (max-width: 1200px) { .masonry-grid { column-count: 3; } }
        @media (max-width: 860px)  { .masonry-grid { column-count: 2; } }
        @media (max-width: 480px)  { .masonry-grid { column-count: 1; } }
        /* =============================================
           MASONRY ITEMS
        ============================================= */
        .masonry-item {
            break-inside: avoid;
            margin-bottom: 20px;
            border-radius: var(--radius-card);
            overflow: hidden;
            cursor: pointer;
            position: relative;
            background: var(--bg-card);
            box-shadow: var(--shadow-card);
            border: 1px solid var(--glass-border);
            transition: transform var(--transition), box-shadow var(--transition);
            animation: fadeUp 0.6s ease both;
        }
        .masonry-item:nth-child(1)  { animation-delay: 0.05s; }
        .masonry-item:nth-child(2)  { animation-delay: 0.10s; }
        .masonry-item:nth-child(3)  { animation-delay: 0.15s; }
        .masonry-item:nth-child(4)  { animation-delay: 0.20s; }
        .masonry-item:nth-child(5)  { animation-delay: 0.25s; }
        .masonry-item:nth-child(6)  { animation-delay: 0.30s; }
        .masonry-item:nth-child(7)  { animation-delay: 0.35s; }
        .masonry-item:nth-child(8)  { animation-delay: 0.40s; }
        .masonry-item:nth-child(9)  { animation-delay: 0.45s; }
        .masonry-item:nth-child(10) { animation-delay: 0.50s; }
        .masonry-item:nth-child(11) { animation-delay: 0.55s; }
        .masonry-item:nth-child(12) { animation-delay: 0.60s; }
        .masonry-item:hover {
            transform: translateY(-5px);
            box-shadow: 0 20px 50px rgba(0,0,0,0.6);
        }
        /* ---- Skeleton Loader ---- */
        .skeleton {
            width: 100%;
            background: linear-gradient(90deg,
                var(--bg-card) 25%,
                #222638 50%,
                var(--bg-card) 75%
            );
            background-size: 200% 100%;
            animation: shimmer 1.6s infinite;
            display: block;
        }
        @keyframes shimmer {
            0%   { background-position: 200% 0; }
            100% { background-position: -200% 0; }
        }
        /* ---- Real image (hidden until loaded) ---- */
        .masonry-item img {
            width: 100%;
            display: block;
            transition: transform var(--transition), filter var(--transition), opacity 0.5s ease;
            opacity: 0;
            position: absolute;
            top: 0; left: 0;
            height: 100%;
            object-fit: cover;
        }
        .masonry-item img.loaded {
            opacity: 1;
            position: relative;
            height: auto;
        }
        .masonry-item:hover img {
            filter: brightness(0.65);
            transform: scale(1.04);
        }
        /* ---- Overlay ---- */
        .item-overlay {
            position: absolute;
            inset: 0;
            padding: 16px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            opacity: 0;
            transition: opacity var(--transition);
            pointer-events: none;
            background: linear-gradient(
                to bottom,
                rgba(0,0,0,0.3) 0%,
                transparent 35%,
                transparent 60%,
                rgba(0,0,0,0.7) 100%
            );
        }
        .masonry-item:hover .item-overlay {
            opacity: 1;
            pointer-events: auto;
        }
        /* ---- Top row of overlay ---- */
        .overlay-top {
            display: flex;
            justify-content: flex-end;
            gap: 8px;
        }
        /* ---- Save button ---- */
        .save-btn {
            background: var(--save-red);
            color: #fff;
            border: none;
            padding: 9px 18px;
            border-radius: 100px;
            font-family: 'Inter', sans-serif;
            font-weight: 700;
            font-size: 0.85rem;
            cursor: pointer;
            letter-spacing: 0.02em;
            transition: background 0.2s, transform 0.2s;
            box-shadow: 0 4px 12px rgba(230,0,35,0.4);
        }
        .save-btn:hover {
            background: var(--save-red-h);
            transform: scale(1.05);
        }
        .save-btn.saved {
            background: #22c55e;
            box-shadow: 0 4px 12px rgba(34,197,94,0.4);
        }
        /* ---- Expand icon button ---- */
        .expand-btn {
            background: rgba(255,255,255,0.18);
            backdrop-filter: blur(8px);
            color: #fff;
            border: 1px solid rgba(255,255,255,0.25);
            width: 36px; height: 36px;
            border-radius: 50%;
            display: flex; align-items: center; justify-content: center;
            cursor: pointer;
            transition: background 0.2s, transform 0.2s;
            font-size: 1rem;
            flex-shrink: 0;
        }
        .expand-btn:hover {
            background: rgba(255,255,255,0.3);
            transform: scale(1.1);
        }
        /* ---- Category pill ---- */
        .item-category {
            display: inline-flex;
            align-items: center;
            background: rgba(255,255,255,0.15);
            backdrop-filter: blur(8px);
            border: 1px solid rgba(255,255,255,0.2);
            color: #fff;
            font-size: 0.72rem;
            font-weight: 600;
            letter-spacing: 0.08em;
            text-transform: uppercase;
            padding: 4px 10px;
            border-radius: 100px;
            margin-bottom: 6px;
            width: fit-content;
        }
        /* ---- Bottom text ---- */
        .item-title {
            color: #fff;
            font-weight: 700;
            font-size: 1rem;
            text-shadow: 0 2px 8px rgba(0,0,0,0.6);
            line-height: 1.3;
        }
        /* =============================================
           LIGHTBOX MODAL
        ============================================= */
        .lightbox {
            position: fixed;
            inset: 0;
            z-index: 1000;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.35s ease;
        }
        .lightbox.open {
            opacity: 1;
            pointer-events: auto;
        }
        .lightbox-backdrop {
            position: absolute;
            inset: 0;
            background: rgba(5, 7, 12, 0.92);
            backdrop-filter: blur(24px);
        }
        .lightbox-content {
            position: relative;
            z-index: 1;
            display: flex;
            gap: 32px;
            max-width: 1000px;
            width: 100%;
            max-height: 90vh;
            transform: scale(0.9) translateY(20px);
            transition: transform 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
        }
        .lightbox.open .lightbox-content {
            transform: scale(1) translateY(0);
        }
        .lightbox-img-wrap {
            flex: 1;
            border-radius: var(--radius-card);
            overflow: hidden;
            max-height: 85vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: var(--bg-card);
            border: 1px solid var(--glass-border);
        }
        .lightbox-img-wrap img {
            width: 100%;
            height: 100%;
            object-fit: contain;
            display: block;
        }
        .lightbox-info {
            width: 280px;
            flex-shrink: 0;
            display: flex;
            flex-direction: column;
            gap: 20px;
            padding: 8px 0;
        }
        .lightbox-category {
            font-size: 0.72rem;
            font-weight: 700;
            letter-spacing: 0.12em;
            text-transform: uppercase;
            color: var(--accent-1);
        }
        .lightbox-title {
            font-family: 'Playfair Display', serif;
            font-size: 1.7rem;
            font-weight: 700;
            color: var(--text-primary);
            line-height: 1.25;
        }
        .lightbox-desc {
            font-size: 0.9rem;
            color: var(--text-sub);
            line-height: 1.7;
        }
        .lightbox-meta {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        .meta-row {
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 0.85rem;
            color: var(--text-muted);
        }
        .meta-icon {
            font-size: 1rem;
            flex-shrink: 0;
        }
        .lightbox-actions {
            display: flex;
            gap: 12px;
            margin-top: auto;
        }
        .lb-save-btn {
            flex: 1;
            background: var(--save-red);
            color: #fff;
            border: none;
            padding: 12px 20px;
            border-radius: 100px;
            font-family: 'Inter', sans-serif;
            font-weight: 700;
            font-size: 0.9rem;
            cursor: pointer;
            transition: background 0.2s, transform 0.15s;
            box-shadow: 0 4px 18px rgba(230,0,35,0.4);
        }
        .lb-save-btn:hover {
            background: var(--save-red-h);
            transform: translateY(-1px);
        }
        .lb-share-btn {
            background: var(--glass-bg);
            border: 1px solid var(--glass-border);
            color: var(--text-primary);
            padding: 12px 20px;
            border-radius: 100px;
            font-family: 'Inter', sans-serif;
            font-weight: 600;
            font-size: 0.9rem;
            cursor: pointer;
            transition: background 0.2s;
            backdrop-filter: blur(8px);
        }
        .lb-share-btn:hover {
            background: rgba(255,255,255,0.1);
        }
        /* ---- Close button ---- */
        .lightbox-close {
            position: absolute;
            top: -16px;
            right: -16px;
            z-index: 2;
            background: var(--bg-card);
            border: 1px solid var(--glass-border);
            color: var(--text-primary);
            width: 42px; height: 42px;
            border-radius: 50%;
            display: flex; align-items: center; justify-content: center;
            cursor: pointer;
            font-size: 1.2rem;
            transition: background 0.2s, transform 0.2s;
        }
        .lightbox-close:hover {
            background: rgba(255,255,255,0.12);
            transform: rotate(90deg);
        }
        /* ---- Nav arrows ---- */
        .lightbox-nav {
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            background: var(--bg-card);
            border: 1px solid var(--glass-border);
            color: var(--text-primary);
            width: 48px; height: 48px;
            border-radius: 50%;
            display: flex; align-items: center; justify-content: center;
            cursor: pointer;
            font-size: 1.3rem;
            transition: background 0.2s, transform 0.2s;
            z-index: 2;
        }
        .lightbox-nav:hover { background: rgba(255,255,255,0.12); }
        .lightbox-prev { left: -70px; }
        .lightbox-next { right: -70px; }
        .lightbox-nav:hover.lightbox-prev { transform: translateY(-50%) translateX(-3px); }
        .lightbox-nav:hover.lightbox-next { transform: translateY(-50%) translateX(3px); }
        @media (max-width: 820px) {
            .lightbox-content { flex-direction: column; }
            .lightbox-info { width: 100%; }
            .lightbox-prev { left: 0; top: auto; bottom: -70px; transform: none; }
            .lightbox-next { right: 0; top: auto; bottom: -70px; transform: none; }
        }
        /* =============================================
           SCROLLBAR
        ============================================= */
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: var(--bg-deep); }
        ::-webkit-scrollbar-thumb { background: #2a2d3e; border-radius: 10px; }
        ::-webkit-scrollbar-thumb:hover { background: #3a3d54; }
    </style>
</head>
<body>
    <!-- Animated gradient background -->
    <div class="bg-canvas" aria-hidden="true">
        <div class="bg-orb"></div>
    </div>
    <div class="page-wrapper">
        <!-- ========== HERO ========== -->
        <header class="hero">
            <div class="hero-eyebrow">Curated Photography</div>
            <h1 class="hero-title">Lumina Gallery</h1>
            <p class="hero-sub">Discover breathtaking imagery across nature, architecture, art, and more — handpicked for visual excellence.</p>
        </header>
        <!-- ========== FILTER TABS ========== -->
        <div class="filters-wrap">
            <div class="filters" role="tablist" aria-label="Photo categories">
                <button class="filter-btn active" data-filter="all" role="tab" aria-selected="true">All</button>
                <button class="filter-btn" data-filter="nature"      role="tab" aria-selected="false">Nature</button>
                <button class="filter-btn" data-filter="architecture" role="tab" aria-selected="false">Architecture</button>
                <button class="filter-btn" data-filter="abstract"    role="tab" aria-selected="false">Abstract</button>
                <button class="filter-btn" data-filter="lifestyle"   role="tab" aria-selected="false">Lifestyle</button>
                <button class="filter-btn" data-filter="cityscape"   role="tab" aria-selected="false">Cityscape</button>
            </div>
        </div>
        <!-- ========== MASONRY GRID ========== -->
        <main class="masonry-grid" id="gallery" aria-label="Photo gallery"></main>
    </div>
    <!-- ========== LIGHTBOX ========== -->
    <div class="lightbox" id="lightbox" role="dialog" aria-modal="true" aria-label="Image viewer">
        <div class="lightbox-backdrop" id="lightbox-backdrop"></div>
        <div class="lightbox-content">
            <button class="lightbox-close" id="lightbox-close" aria-label="Close lightbox">✕</button>
            <button class="lightbox-nav lightbox-prev" id="lightbox-prev" aria-label="Previous image">←</button>
            <button class="lightbox-nav lightbox-next" id="lightbox-next" aria-label="Next image">→</button>
            <div class="lightbox-img-wrap">
                <img id="lightbox-img" src="" alt="">
            </div>
            <div class="lightbox-info">
                <div>
                    <div class="lightbox-category" id="lightbox-category"></div>
                    <h2 class="lightbox-title" id="lightbox-title"></h2>
                </div>
                <p class="lightbox-desc" id="lightbox-desc"></p>
                <div class="lightbox-meta" id="lightbox-meta">
                    <div class="meta-row"><span class="meta-icon">📸</span> <span id="meta-camera"></span></div>
                    <div class="meta-row"><span class="meta-icon">📍</span> <span id="meta-location"></span></div>
                    <div class="meta-row"><span class="meta-icon">🗓️</span> <span id="meta-date"></span></div>
                </div>
                <div class="lightbox-actions">
                    <button class="lb-save-btn" id="lb-save">Save to Board</button>
                    <button class="lb-share-btn" id="lb-share">Share ↗</button>
                </div>
            </div>
        </div>
    </div>
    <script>
        /* =============================================
           DATA — Gallery items
        ============================================= */
        const PHOTOS = [
            {
                id: 1, seed: 'pk1', w: 400, h: 600,
                title: 'Mountain Retreat',
                category: 'nature',
                desc: 'A tranquil alpine lodge nestled between towering peaks, where mist rolls through ancient pine forests at dawn.',
                camera: 'Sony A7 IV · f/8 · 1/250s', location: 'Swiss Alps, Switzerland', date: 'Jul 2025'
            },
            {
                id: 2, seed: 'arch42', w: 400, h: 400,
                title: 'Brutalist Form',
                category: 'architecture',
                desc: 'Raw concrete geometry meets soft northern light in this striking study of modernist architecture.',
                camera: 'Leica M11 · f/5.6 · 1/500s', location: 'Berlin, Germany', date: 'Mar 2025'
            },
            {
                id: 3, seed: 'abs77', w: 400, h: 800,
                title: 'Chromatic Drift',
                category: 'abstract',
                desc: 'An explosion of pigment suspended in still water, capturing a fleeting moment of colour in motion.',
                camera: 'Canon EOS R5 · f/11 · 1/60s', location: 'Studio, Tokyo', date: 'Jan 2025'
            },
            {
                id: 4, seed: 'life18', w: 400, h: 500,
                title: 'Morning Ritual',
                category: 'lifestyle',
                desc: 'Warm golden light streams through linen curtains onto a minimalist ceramic coffee service.',
                camera: 'Fujifilm X-T5 · f/2.0 · 1/80s', location: 'Copenhagen, Denmark', date: 'May 2025'
            },
            {
                id: 5, seed: 'nat33', w: 400, h: 700,
                title: 'Verdant Canopy',
                category: 'nature',
                desc: 'Ancient ferns reach upward through cathedral-like columns of light in an old-growth rainforest.',
                camera: 'Nikon Z8 · f/4 · 1/125s', location: 'Daintree, Australia', date: 'Sep 2024'
            },
            {
                id: 6, seed: 'city90', w: 400, h: 450,
                title: 'Midnight Grid',
                category: 'cityscape',
                desc: 'The neon veins of the city pulse below, a living circuit board photographed from the 72nd floor.',
                camera: 'Sony A1 · f/8 · 30s', location: 'Hong Kong SAR', date: 'Nov 2024'
            },
            {
                id: 7, seed: 'abs55', w: 400, h: 850,
                title: 'Fracture Lines',
                category: 'abstract',
                desc: 'Cracked earth at the edge of a salt flat reveals intricate geometric patterns etched by time and drought.',
                camera: 'DJI Mavic 3 · Aerial', location: 'Salar de Uyuni, Bolivia', date: 'Jun 2025'
            },
            {
                id: 8, seed: 'city12', w: 400, h: 350,
                title: 'Electric Alley',
                category: 'cityscape',
                desc: 'Rain-slicked cobblestones reflect a riot of neon signage, turning an ordinary alley into a dreamscape.',
                camera: 'Ricoh GR IIIx · f/2.8 · 1/30s', location: 'Osaka, Japan', date: 'Feb 2025'
            },
            {
                id: 9, seed: 'nat66', w: 400, h: 650,
                title: 'Tidal Mirror',
                category: 'nature',
                desc: 'A glassy low-tide expanse perfectly mirrors a blazing sunset sky, dissolving the horizon entirely.',
                camera: 'Nikon Z9 · f/11 · 1/8s', location: 'Mont Saint-Michel, France', date: 'Aug 2025'
            },
            {
                id: 10, seed: 'life44', w: 400, h: 550,
                title: 'Studio Session',
                category: 'lifestyle',
                desc: 'Sunlight pours across a craftsman\'s worktable scattered with brushes, pigments, and quiet creativity.',
                camera: 'Fujifilm GFX 100S · f/4 · 1/200s', location: 'Portland, Oregon', date: 'Apr 2025'
            },
            {
                id: 11, seed: 'arch88', w: 400, h: 480,
                title: 'Glass Cathedral',
                category: 'architecture',
                desc: 'A soaring atrium of steel and glass floods the interior with diffused daylight and geometric shadow.',
                camera: 'Canon EOS R3 · f/8 · 1/320s', location: 'Rotterdam, Netherlands', date: 'Oct 2024'
            },
            {
                id: 12, seed: 'abs22', w: 400, h: 720,
                title: 'Velvet Bloom',
                category: 'abstract',
                desc: 'A macro study of a deep purple dahlia — petals unfurling in concentric spirals like a living galaxy.',
                camera: 'Sony A7 IV · 90mm Macro · f/3.5', location: 'Giverny, France', date: 'Jul 2025'
            },
        ];
        /* =============================================
           STATE
        ============================================= */
        let currentFilter = 'all';
        let lightboxIndex = 0;
        let filteredPhotos = [...PHOTOS];
        let savedIds = new Set();
        /* =============================================
           RENDER GALLERY
        ============================================= */
        function renderGallery(photos) {
            const grid = document.getElementById('gallery');
            grid.innerHTML = '';
            photos.forEach((photo, idx) => {
                const item = document.createElement('div');
                item.className = 'masonry-item';
                item.dataset.id = photo.id;
                item.dataset.idx = idx;
                item.style.animationDelay = `${idx * 0.05}s`;
                const imgSrc = `https://picsum.photos/seed/${photo.seed}/${photo.w}/${photo.h}`;
                const aspectPct = (photo.h / photo.w * 100).toFixed(2);
                const isSaved = savedIds.has(photo.id);
                item.innerHTML = `
                    <!-- Skeleton placeholder -->
                    <div class="skeleton" style="padding-top:${aspectPct}%;"></div>
                    <!-- Real image -->
                    <img src="${imgSrc}" alt="${photo.title}" loading="lazy">
                    <!-- Overlay -->
                    <div class="item-overlay">
                        <div class="overlay-top">
                            <button class="save-btn ${isSaved ? 'saved' : ''}" data-id="${photo.id}" aria-label="Save ${photo.title}">
                                ${isSaved ? '✓ Saved' : 'Save'}
                            </button>
                            <button class="expand-btn" data-idx="${idx}" aria-label="Expand ${photo.title}">⤢</button>
                        </div>
                        <div>
                            <div class="item-category">${photo.category}</div>
                            <div class="item-title">${photo.title}</div>
                        </div>
                    </div>
                `;
                // Image load handler — fade in over skeleton
                const img = item.querySelector('img');
                const skeleton = item.querySelector('.skeleton');
                img.addEventListener('load', () => {
                    img.classList.add('loaded');
                    skeleton.style.display = 'none';
                });
                img.addEventListener('error', () => {
                    skeleton.style.background = '#1a1d27';
                });
                // Click to open lightbox
                item.addEventListener('click', (e) => {
                    if (e.target.classList.contains('save-btn')) return;
                    if (e.target.classList.contains('expand-btn')) return;
                    openLightbox(idx);
                });
                grid.appendChild(item);
            });
            // Wire save buttons
            grid.querySelectorAll('.save-btn').forEach(btn => {
                btn.addEventListener('click', (e) => {
                    e.stopPropagation();
                    const id = +btn.dataset.id;
                    toggleSave(id, btn);
                });
            });
            // Wire expand buttons
            grid.querySelectorAll('.expand-btn').forEach(btn => {
                btn.addEventListener('click', (e) => {
                    e.stopPropagation();
                    openLightbox(+btn.dataset.idx);
                });
            });
        }
        /* =============================================
           SAVE TOGGLE
        ============================================= */
        function toggleSave(id, btn) {
            if (savedIds.has(id)) {
                savedIds.delete(id);
                btn.textContent = 'Save';
                btn.classList.remove('saved');
            } else {
                savedIds.add(id);
                btn.textContent = '✓ Saved';
                btn.classList.add('saved');
            }
        }
        /* =============================================
           FILTER LOGIC
        ============================================= */
        document.querySelectorAll('.filter-btn').forEach(btn => {
            btn.addEventListener('click', () => {
                document.querySelectorAll('.filter-btn').forEach(b => {
                    b.classList.remove('active');
                    b.setAttribute('aria-selected', 'false');
                });
                btn.classList.add('active');
                btn.setAttribute('aria-selected', 'true');
                currentFilter = btn.dataset.filter;
                filteredPhotos = currentFilter === 'all'
                    ? [...PHOTOS]
                    : PHOTOS.filter(p => p.category === currentFilter);
                renderGallery(filteredPhotos);
            });
        });
        /* =============================================
           LIGHTBOX
        ============================================= */
        function openLightbox(idx) {
            lightboxIndex = idx;
            updateLightbox();
            document.getElementById('lightbox').classList.add('open');
            document.body.style.overflow = 'hidden';
        }
        function closeLightbox() {
            document.getElementById('lightbox').classList.remove('open');
            document.body.style.overflow = '';
        }
        function updateLightbox() {
            const photo = filteredPhotos[lightboxIndex];
            if (!photo) return;
            const imgSrc = `https://picsum.photos/seed/${photo.seed}/${photo.w}/${photo.h}`;
            document.getElementById('lightbox-img').src   = imgSrc;
            document.getElementById('lightbox-img').alt   = photo.title;
            document.getElementById('lightbox-title').textContent    = photo.title;
            document.getElementById('lightbox-category').textContent = photo.category.toUpperCase();
            document.getElementById('lightbox-desc').textContent     = photo.desc;
            document.getElementById('meta-camera').textContent       = photo.camera;
            document.getElementById('meta-location').textContent     = photo.location;
            document.getElementById('meta-date').textContent         = photo.date;
        }
        document.getElementById('lightbox-close').addEventListener('click', closeLightbox);
        document.getElementById('lightbox-backdrop').addEventListener('click', closeLightbox);
        document.getElementById('lightbox-prev').addEventListener('click', () => {
            lightboxIndex = (lightboxIndex - 1 + filteredPhotos.length) % filteredPhotos.length;
            updateLightbox();
        });
        document.getElementById('lightbox-next').addEventListener('click', () => {
            lightboxIndex = (lightboxIndex + 1) % filteredPhotos.length;
            updateLightbox();
        });
        // Keyboard navigation
        document.addEventListener('keydown', (e) => {
            const lb = document.getElementById('lightbox');
            if (!lb.classList.contains('open')) return;
            if (e.key === 'Escape')      closeLightbox();
            if (e.key === 'ArrowLeft')  { lightboxIndex = (lightboxIndex - 1 + filteredPhotos.length) % filteredPhotos.length; updateLightbox(); }
            if (e.key === 'ArrowRight') { lightboxIndex = (lightboxIndex + 1) % filteredPhotos.length; updateLightbox(); }
        });
        // Share placeholder
        document.getElementById('lb-share').addEventListener('click', () => {
            const photo = filteredPhotos[lightboxIndex];
            if (navigator.share) {
                navigator.share({ title: photo.title, url: window.location.href });
            } else {
                navigator.clipboard.writeText(window.location.href).then(() => {
                    const btn = document.getElementById('lb-share');
                    btn.textContent = 'Copied! ✓';
                    setTimeout(() => btn.textContent = 'Share ↗', 2000);
                });
            }
        });
        // Save from lightbox
        document.getElementById('lb-save').addEventListener('click', () => {
            const photo = filteredPhotos[lightboxIndex];
            const btn = document.getElementById('lb-save');
            if (savedIds.has(photo.id)) {
                savedIds.delete(photo.id);
                btn.textContent = 'Save to Board';
                btn.style.background = '';
            } else {
                savedIds.add(photo.id);
                btn.textContent = '✓ Saved!';
                btn.style.background = '#22c55e';
                setTimeout(() => {
                    btn.textContent = 'Save to Board';
                    btn.style.background = '';
                }, 1500);
            }
        });
        /* =============================================
           INIT
        ============================================= */
        renderGallery(PHOTOS);
    </script>
</body>
