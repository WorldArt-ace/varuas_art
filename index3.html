<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>Sorry · Soniya · Love Butterflies</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: radial-gradient(circle at 20% 30%, #1a0b2e 0%, #0d0518 50%, #03010a 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Segoe UI', 'Poppins', system-ui, sans-serif;
            overflow: hidden;
            position: relative;
            padding: 16px;
        }

        /* animated glowing background orbs */
        .bg-glow {
            position: fixed;
            width: 60vw;
            height: 60vw;
            max-width: 700px;
            max-height: 700px;
            background: radial-gradient(circle, rgba(255, 100, 200, 0.25), transparent 70%);
            border-radius: 50%;
            filter: blur(50px);
            top: 10%;
            left: 5%;
            animation: floatGlow 12s infinite alternate ease-in-out;
            z-index: 0;
            pointer-events: none;
        }

        .bg-glow.second {
            background: radial-gradient(circle, rgba(255, 180, 80, 0.25), transparent 70%);
            top: 50%;
            left: 50%;
            width: 45vw;
            height: 45vw;
            animation-duration: 16s;
            animation-delay: 2s;
        }

        @keyframes floatGlow {
            0% { transform: translate(0, 0) scale(1); opacity: 0.7; }
            100% { transform: translate(-30px, 30px) scale(1.2); opacity: 1; }
        }

        /* main card container */
        .love-container {
            position: relative;
            z-index: 10;
            width: 100%;
            max-width: 850px;
            background: rgba(30, 15, 45, 0.45);
            backdrop-filter: blur(18px);
            -webkit-backdrop-filter: blur(18px);
            border: 1px solid rgba(255, 200, 240, 0.3);
            border-radius: 60px;
            padding: 3rem 2rem;
            text-align: center;
            box-shadow: 0 30px 60px rgba(0, 0, 0, 0.6), 0 0 80px rgba(255, 120, 200, 0.3);
            animation: softBreath 5s infinite alternate;
            transition: all 0.3s;
        }

        @keyframes softBreath {
            0% { box-shadow: 0 30px 60px rgba(0,0,0,0.7), 0 0 60px rgba(255, 130, 190, 0.5); }
            100% { box-shadow: 0 40px 80px rgba(0,0,0,0.8), 0 0 100px rgba(255, 160, 220, 0.8); }
        }

        h1 {
            font-size: clamp(2.2rem, 12vw, 4.5rem);
            font-weight: 700;
            letter-spacing: 4px;
            background: linear-gradient(135deg, #ffd9e8, #ffb3d1, #ff80b5, #ff4d94);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            text-shadow: 0 0 30px rgba(255, 105, 180, 0.7);
            margin-bottom: 0.4rem;
            animation: shimmer 4s linear infinite;
        }

        @keyframes shimmer {
            0% { filter: hue-rotate(0deg); }
            50% { filter: hue-rotate(20deg); }
            100% { filter: hue-rotate(0deg); }
        }

        .subtitle {
            font-size: 1.7rem;
            font-weight: 400;
            color: #f9d7eb;
            letter-spacing: 2px;
            margin-bottom: 1.2rem;
            text-shadow: 0 0 20px #ff95c5;
            background: rgba(255, 200, 230, 0.15);
            display: inline-block;
            padding: 0.5rem 2rem;
            border-radius: 50px;
            backdrop-filter: blur(5px);
            border: 1px solid rgba(255, 180, 210, 0.5);
        }

        .apology {
            font-size: 1.35rem;
            color: #ffe4f1;
            max-width: 600px;
            margin: 1.5rem auto;
            line-height: 1.6;
            background: rgba(0, 0, 0, 0.25);
            padding: 1.2rem 2rem;
            border-radius: 40px;
            border-left: 4px solid #ff85c2;
            border-right: 4px solid #ff85c2;
            font-style: italic;
            letter-spacing: 0.5px;
            text-shadow: 0 0 8px #ffa5d0;
        }

        /* butterfly canvas layer */
        .butterfly-field {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 5;
        }

        /* floating hearts + tiny sparkles */
        .tiny-heart {
            position: fixed;
            bottom: -30px;
            color: rgba(255, 120, 200, 0.7);
            font-size: 1.4rem;
            animation: floatUp linear infinite;
            pointer-events: none;
            z-index: 2;
            filter: drop-shadow(0 0 10px #ff69b4);
        }

        @keyframes floatUp {
            0% { transform: translateY(0) rotate(0deg) scale(0.7); opacity: 0.3; }
            50% { opacity: 0.9; }
            100% { transform: translateY(-110vh) rotate(360deg) scale(1.2); opacity: 0; }
        }

        /* respond to smaller screens */
        @media (max-width: 550px) {
            .love-container {
                padding: 2rem 1rem;
                border-radius: 40px;
            }
            .apology {
                font-size: 1.1rem;
                padding: 0.8rem 1.2rem;
            }
        }
    </style>
</head>
<body>

    <!-- ambient glowing orbs -->
    <div class="bg-glow"></div>
    <div class="bg-glow second"></div>

    <!-- Love butterflies canvas (main animation) -->
    <canvas id="butterflyCanvas" class="butterfly-field"></canvas>

    <!-- small floating hearts for extra sweetness -->
    <div id="hearts-layer"></div>

    <!-- main card -->
    <div class="love-container">
        <h1>I'M SORRY</h1>
        <div class="subtitle">💖 SONIYA 💖</div>
        <div class="apology">
            my baby love wify,<br>
            every butterfly carries my love,<br>
            every colour whispers your name.<br>
            forgive me, you are my whole world.
        </div>
        <div style="margin-top: 1.2rem; font-size: 1.8rem; letter-spacing: 3px;">
            🦋✨🌸✨🦋
        </div>
    </div>

    <script>
        (function() {

            // ---------- LOVE BUTTERFLY CANVAS ENGINE ----------
            const canvas = document.getElementById('butterflyCanvas');
            const ctx = canvas.getContext('2d');
            let width, height;
            
            // array to hold butterfly objects
            let butterflies = [];

            // butterfly shape: two overlapping hearts + tiny body
            function drawHeart(ctx, x, y, size, color, rotation = 0, alpha = 1) {
                ctx.save();
                ctx.translate(x, y);
                ctx.rotate(rotation);
                ctx.scale(size, size);
                ctx.globalAlpha = alpha;
                ctx.fillStyle = color;
                ctx.shadowColor = color;
                ctx.shadowBlur = 12;
                ctx.beginPath();
                // heart bezier path
                ctx.moveTo(0, 0.3);
                ctx.bezierCurveTo(-0.5, -0.2, -0.2, -0.8, 0, -0.3);
                ctx.bezierCurveTo(0.2, -0.8, 0.5, -0.2, 0, 0.3);
                ctx.fill();
                ctx.restore();
            }

            function drawLoveButterfly(ctx, b) {
                const size = b.size; // base scale
                const angle = b.angle; // rotation around center
                const flap = Math.sin(b.flapPhase) * b.flapAmplitude;
                
                // left upper wing (heart)
                drawHeart(ctx, 
                    b.x - size * 0.25 * (1 + flap*0.3), 
                    b.y - size * 0.1, 
                    size * 0.55, 
                    b.color1, 
                    angle - 0.4 + flap * 0.25, 
                    b.opacity);
                
                // right upper wing (heart)
                drawHeart(ctx, 
                    b.x + size * 0.25 * (1 + flap*0.3), 
                    b.y - size * 0.1, 
                    size * 0.55, 
                    b.color2, 
                    angle + 0.4 - flap * 0.25, 
                    b.opacity);
                
                // lower left wing (smaller heart)
                drawHeart(ctx, 
                    b.x - size * 0.3 * (1 + flap*0.2), 
                    b.y + size * 0.15, 
                    size * 0.4, 
                    b.color3, 
                    angle - 0.55 + flap * 0.2, 
                    b.opacity * 0.9);
                
                // lower right wing 
                drawHeart(ctx, 
                    b.x + size * 0.3 * (1 + flap*0.2), 
                    b.y + size * 0.15, 
                    size * 0.4, 
                    b.color4, 
                    angle + 0.55 - flap * 0.2, 
                    b.opacity * 0.9);
                
                // tiny body (line)
                ctx.save();
                ctx.translate(b.x, b.y);
                ctx.rotate(angle);
                ctx.beginPath();
                ctx.strokeStyle = '#fff9e6';
                ctx.lineWidth = size * 0.15;
                ctx.shadowBlur = 15;
                ctx.shadowColor = '#ffb3d9';
                ctx.moveTo(0, -size * 0.35);
                ctx.lineTo(0, size * 0.3);
                ctx.stroke();
                ctx.restore();
            }

            function createButterfly() {
                const colorsPool = [
                    ['#ff4d94', '#ff80b5', '#ffb3d1', '#ff1a66'], // pink/passion
                    ['#ffaa33', '#ff6b9d', '#ff8c42', '#ff477e'], // sunset
                    ['#b388ff', '#ff8ac2', '#7c4dff', '#ff6ec7'], // violet love
                    ['#ff6b6b', '#ffb347', '#ff5e78', '#ffd166'], // coral
                    ['#4dd2ff', '#ff85c2', '#40c4ff', '#ff4d88'], // sky love
                    ['#ff9f1c', '#ff4d6d', '#ffb703', '#fb5607'], // fiery love
                    ['#f15bb5', '#9b5de5', '#fee440', '#00bbf9'], // rainbow
                ];
                const idx = Math.floor(Math.random() * colorsPool.length);
                const [c1, c2, c3, c4] = colorsPool[idx];
                
                return {
                    x: Math.random() * width,
                    y: Math.random() * height,
                    size: 10 + Math.random() * 28, // varied size
                    color1: c1,
                    color2: c2,
                    color3: c3,
                    color4: c4,
                    angle: (Math.random() * Math.PI * 2) - Math.PI,
                    flapPhase: Math.random() * Math.PI * 2,
                    flapSpeed: 0.02 + Math.random() * 0.05,
                    flapAmplitude: 0.3 + Math.random() * 0.5,
                    vx: (Math.random() - 0.5) * 0.9,
                    vy: (Math.random() - 0.5) * 0.6,
                    opacity: 0.75 + Math.random() * 0.25,
                    life: 0.8 + Math.random() * 1.5,
                    maxLife: 2.0,
                };
            }

            function resizeCanvas() {
                width = window.innerWidth;
                height = window.innerHeight;
                canvas.width = width;
                canvas.height = height;
            }

            function animateButterflies() {
                ctx.clearRect(0, 0, width, height);
                
                // update and draw butterflies
                for (let i = butterflies.length - 1; i >= 0; i--) {
                    const b = butterflies[i];
                    
                    // movement
                    b.x += b.vx;
                    b.y += b.vy;
                    
                    // gentle angle drift
                    b.angle += 0.005 + Math.sin(b.flapPhase) * 0.01;
                    
                    // flap update
                    b.flapPhase += b.flapSpeed;
                    
                    // life fade in/out
                    b.life -= 0.0015;
                    if (b.life <= 0) {
                        butterflies.splice(i, 1);
                        continue;
                    }
                    b.opacity = Math.min(1, Math.max(0.5, b.life));
                    
                    // wrap around edges with margin
                    const margin = 60;
                    if (b.x < -margin) b.x = width + margin;
                    if (b.x > width + margin) b.x = -margin;
                    if (b.y < -margin) b.y = height + margin;
                    if (b.y > height + margin) b.y = -margin;
                    
                    drawLoveButterfly(ctx, b);
                }
                
                // add new butterflies to maintain population
                const targetCount = Math.min(42, Math.floor(width * height / 18000)); // dynamic based on screen
                while (butterflies.length < targetCount) {
                    butterflies.push(createButterfly());
                }
                
                requestAnimationFrame(animateButterflies);
            }

            // ---------- tiny floating hearts (additional layer) ----------
            function createTinyHeart() {
                const heartLayer = document.getElementById('hearts-layer');
                if (!heartLayer) return;
                const heart = document.createElement('div');
                heart.className = 'tiny-heart';
                heart.textContent = ['💖', '💕', '🦋', '💗', '✨', '💘'][Math.floor(Math.random() * 6)];
                heart.style.left = Math.random() * 100 + '%';
                heart.style.fontSize = (0.9 + Math.random() * 1.8) + 'rem';
                heart.style.animationDuration = (6 + Math.random() * 8) + 's';
                heart.style.opacity = Math.random() * 0.6 + 0.4;
                heartLayer.appendChild(heart);
                
                // remove after animation ends
                setTimeout(() => {
                    if (heart.parentNode) heart.remove();
                }, 12000);
            }

            function spawnHearts() {
                setInterval(() => {
                    createTinyHeart();
                    // occasionally spawn two at once
                    if (Math.random() > 0.6) createTinyHeart();
                }, 300);
            }

            // ---------- INITIALIZATION ----------
            function init() {
                resizeCanvas();
                window.addEventListener('resize', () => {
                    resizeCanvas();
                    // adjust butterflies count gracefully
                });
                
                // start butterfly animation
                animateButterflies();
                
                // start floating hearts
                spawnHearts();
                
                // create initial burst of butterflies
                for (let i = 0; i < 25; i++) {
                    butterflies.push(createButterfly());
                }
            }

            init();
        })();
    </script>
</body>
</html>
