<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="theme-color" content="#F4EFE4">
<title>Panora · 360° Equirectangular Viewer</title>
<style>
  /* ============ TOKENS ============ */
  :root{
    --beige-50:#FBF9F4;
    --beige-100:#F4EFE4;
    --beige-200:#E9E1CF;
    --beige-300:#DACFB6;
    --green-100:#E6EFDF;
    --green-200:#CDE0C3;
    --green-300:#B2CFA4;
    --green-400:#94BB84;
    --green-500:#75A263;
    --green-600:#5B854B;
    --ink:#33402F;
    --ink-2:#61705A;
    --glass:rgba(251,249,244,.82);
    --stroke:rgba(218,207,182,.85);
    --shadow-sm:0 4px 14px rgba(51,64,47,.08);
    --shadow-md:0 10px 30px rgba(51,64,47,.14);
  }

  /* ============ BASE ============ */
  *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{
    font-family:"Inter",system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
    background:var(--beige-100);
    color:var(--ink);
    overflow:hidden;
    -webkit-font-smoothing:antialiased;
    -moz-osx-font-smoothing:grayscale;
    -webkit-tap-highlight-color:transparent;
  }
  button{font-family:inherit}

  /* ============ CANVAS ============ */
  #view{
    position:fixed; inset:0;
    width:100%; height:100%;
    display:block;
    cursor:grab;
    touch-action:none;
    background:#c9d3c0;
  }
  #view.grabbing{cursor:grabbing}

  /* ============ TOP BAR ============ */
  .topbar{
    position:fixed; top:18px; left:18px; right:18px;
    display:flex; align-items:center; justify-content:flex-start;
    gap:12px; z-index:20; pointer-events:none;
  }
  .topbar > *{pointer-events:auto}

  .brand{
    display:flex; align-items:center; gap:11px;
    padding:7px 20px 7px 8px;
    background:var(--glass);
    border:1px solid rgba(255,255,255,.65);
    border-radius:999px;
    box-shadow:var(--shadow-sm);
    backdrop-filter:blur(16px) saturate(150%);
    -webkit-backdrop-filter:blur(16px) saturate(150%);
  }
  .brand-mark{
    width:38px; height:38px; flex:0 0 38px;
    border-radius:50%;
    display:grid; place-items:center;
    background:linear-gradient(140deg,var(--green-400),var(--green-600));
    color:#fff; font-size:11px; font-weight:800; letter-spacing:.02em;
    box-shadow:inset 0 1px 0 rgba(255,255,255,.35), 0 3px 10px rgba(91,133,75,.35);
  }
  .brand-text{display:flex; flex-direction:column; line-height:1.15}
  .brand-title{font-size:14.5px; font-weight:650; letter-spacing:-.01em; color:var(--ink)}
  .brand-sub{font-size:9.5px; font-weight:600; letter-spacing:.18em; text-transform:uppercase; color:var(--ink-2); opacity:.85}

  /* ============ DOCK ============ */
  .dock{
    position:fixed; right:18px; top:50%; transform:translateY(-50%);
    display:flex; flex-direction:column; gap:10px; z-index:20;
    padding:10px;
    background:rgba(251,249,244,.6);
    border:1px solid rgba(255,255,255,.6);
    border-radius:999px;
    box-shadow:var(--shadow-sm);
    backdrop-filter:blur(16px) saturate(150%);
    -webkit-backdrop-filter:blur(16px) saturate(150%);
  }
  .icon-btn{
    width:46px; height:46px;
    display:grid; place-items:center;
    border-radius:50%;
    border:1px solid transparent;
    background:transparent;
    color:var(--ink-2);
    cursor:pointer;
    transition:background .2s ease, color .2s ease, transform .12s ease, box-shadow .2s ease, border-color .2s ease;
  }
  .icon-btn:hover{background:#fff; color:var(--green-600); box-shadow:var(--shadow-sm); border-color:var(--beige-200)}
  .icon-btn:active{transform:scale(.94)}
  .icon-btn:focus-visible{outline:2px solid var(--green-400); outline-offset:2px}
  .icon-btn.active{
    background:linear-gradient(140deg,var(--green-400),var(--green-600));
    color:#fff;
    box-shadow:0 5px 16px rgba(91,133,75,.38);
  }
  .icon-btn svg{width:20px; height:20px; display:block}

  /* ============ HINT ============ */
  .hint{
    position:fixed; left:18px; bottom:18px; z-index:20;
    display:flex; align-items:center; gap:9px;
    padding:9px 16px;
    background:var(--glass);
    border:1px solid rgba(255,255,255,.65);
    border-radius:999px;
    box-shadow:var(--shadow-sm);
    backdrop-filter:blur(16px) saturate(150%);
    -webkit-backdrop-filter:blur(16px) saturate(150%);
    font-size:12.5px; font-weight:500; color:var(--ink-2);
    transition:opacity .5s ease, transform .5s ease;
  }
  .hint .dot{
    width:7px; height:7px; border-radius:50%;
    background:var(--green-400);
    box-shadow:0 0 0 4px rgba(148,187,132,.22);
    animation:pulse 2.4s ease-in-out infinite;
  }
  @keyframes pulse{0%,100%{opacity:1}50%{opacity:.35}}
  .hint.hide{opacity:0; transform:translateY(10px); pointer-events:none}

  /* ============ LOADER ============ */
  .loader{
    position:fixed; inset:0; z-index:70;
    display:none; align-items:center; justify-content:center;
    background:rgba(244,239,228,.55);
    backdrop-filter:blur(4px);
    -webkit-backdrop-filter:blur(4px);
  }
  .loader.active{display:flex}
  .spinner{
    width:44px; height:44px; border-radius:50%;
    border:3px solid rgba(117,162,99,.18);
    border-top-color:var(--green-500);
    animation:spin .85s linear infinite;
  }
  @keyframes spin{to{transform:rotate(360deg)}}

  /* ============ TOAST ============ */
  .toast{
    position:fixed; left:50%; bottom:26px; z-index:80;
    transform:translate(-50%,16px);
    padding:11px 20px;
    border-radius:999px;
    background:rgba(51,64,47,.92);
    color:#F4EFE4;
    font-size:13px; font-weight:550;
    box-shadow:0 12px 30px rgba(51,64,47,.28);
    opacity:0; pointer-events:none;
    transition:opacity .3s ease, transform .3s ease;
  }
  .toast.show{opacity:1; transform:translate(-50%,0)}

  /* ============ FALLBACK ============ */
  .fallback{
    position:fixed; inset:0; display:grid; place-items:center;
    padding:40px; text-align:center; font-size:15px; color:var(--ink);
  }

  /* ============ RESPONSIVE ============ */
  @media (max-width:720px){
    .topbar{top:10px; left:10px; right:10px}
    .brand{padding:6px 14px 6px 6px; gap:9px}
    .brand-mark{width:34px; height:34px; flex-basis:34px; font-size:10px}
    .brand-title{font-size:13.5px}
    .brand-sub{display:none}
    .dock{right:10px; gap:7px; padding:8px}
    .icon-btn{width:42px; height:42px}
    .icon-btn svg{width:18px; height:18px}
    .hint{left:10px; bottom:10px; font-size:11.5px; padding:8px 13px}
  }
  @media (prefers-reduced-motion:reduce){
    *{animation-duration:.01ms !important; transition-duration:.01ms !important}
  }
</style>
</head>
<body>

<canvas id="view"></canvas>

<!-- ============ TOP BAR ============ -->
<header class="topbar">
  <div class="brand">
    <div class="brand-mark">360</div>
    <div class="brand-text">
      <span class="brand-title">Panora Viewer</span>
      <span class="brand-sub">Equirectangular</span>
    </div>
  </div>
</header>

<!-- ============ SIDE DOCK ============ -->
<div class="dock" role="toolbar" aria-label="Viewer controls">
  <button class="icon-btn" id="btnZoomIn" type="button" title="Zoom in" aria-label="Zoom in">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
         stroke-linecap="round" stroke-linejoin="round">
      <circle cx="11" cy="11" r="7"/><line x1="11" y1="8" x2="11" y2="14"/>
      <line x1="8" y1="11" x2="14" y2="11"/><line x1="16.5" y1="16.5" x2="21" y2="21"/>
    </svg>
  </button>

  <button class="icon-btn" id="btnZoomOut" type="button" title="Zoom out" aria-label="Zoom out">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
         stroke-linecap="round" stroke-linejoin="round">
      <circle cx="11" cy="11" r="7"/><line x1="8" y1="11" x2="14" y2="11"/>
      <line x1="16.5" y1="16.5" x2="21" y2="21"/>
    </svg>
  </button>

  <button class="icon-btn" id="btnAuto" type="button" title="Auto rotate" aria-label="Auto rotate">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
         stroke-linecap="round" stroke-linejoin="round">
      <polyline points="23 4 23 10 17 10"/>
      <path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10"/>
    </svg>
  </button>

  <button class="icon-btn" id="btnReset" type="button" title="Reset view" aria-label="Reset view">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
         stroke-linecap="round" stroke-linejoin="round">
      <circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="3.2"/>
      <line x1="12" y1="1.5" x2="12" y2="4.5"/><line x1="12" y1="19.5" x2="12" y2="22.5"/>
      <line x1="1.5" y1="12" x2="4.5" y2="12"/><line x1="19.5" y1="12" x2="22.5" y2="12"/>
    </svg>
  </button>

  <button class="icon-btn" id="btnFull" type="button" title="Fullscreen" aria-label="Fullscreen">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
         stroke-linecap="round" stroke-linejoin="round">
      <path d="M8 3H5a2 2 0 0 0-2 2v3"/>
      <path d="M16 3h3a2 2 0 0 1 2 2v3"/>
      <path d="M16 21h3a2 2 0 0 0 2-2v-3"/>
      <path d="M8 21H5a2 2 0 0 1-2-2v-3"/>
    </svg>
  </button>
</div>

<!-- ============ HINT ============ -->
<div class="hint" id="hint">
  <span class="dot"></span>
  Drag to look around · Scroll to zoom
</div>

<!-- ============ LOADER ============ -->
<div class="loader" id="loader"><div class="spinner"></div></div>

<!-- ============ TOAST ============ -->
<div class="toast" id="toast"></div>

<script>
(function () {
  'use strict';

  /* =========================================================
     WEBGL SETUP
     ========================================================= */
  const canvas = document.getElementById('view');
  const gl = canvas.getContext('webgl', { antialias: false, alpha: false, depth: false })
          || canvas.getContext('experimental-webgl', { antialias: false, alpha: false, depth: false });

  if (!gl) {
    document.body.innerHTML =
      '<div class="fallback">Your browser does not support WebGL.<br>Please try a modern browser.</div>';
    return;
  }

  const VERT_SRC = `
    attribute vec2 aPos;
    varying vec2 vNdc;
    void main() {
      vNdc = aPos;
      gl_Position = vec4(aPos, 0.0, 1.0);
    }
  `;

  const FRAG_SRC = `
    #ifdef GL_FRAGMENT_PRECISION_HIGH
      precision highp float;
    #else
      precision mediump float;
    #endif

    varying vec2 vNdc;
    uniform mat3  uRot;
    uniform float uTanFov;
    uniform float uAspect;
    uniform sampler2D uTex;

    const float PI = 3.14159265359;

    void main() {
      /* Camera ray in view space (-Z forward) */
      vec3 dir = normalize(vec3(vNdc.x * uTanFov * uAspect, vNdc.y * uTanFov, -1.0));
      /* To world space */
      vec3 w = uRot * dir;
      /* Equirectangular mapping */
      float u = atan(w.z, w.x) * (0.5 / PI) + 0.5;
      float v = acos(clamp(w.y, -1.0, 1.0)) * (1.0 / PI);
      gl_FragColor = vec4(texture2D(uTex, vec2(u, v)).rgb, 1.0);
    }
  `;

  function compile(type, src) {
    const s = gl.createShader(type);
    gl.shaderSource(s, src);
    gl.compileShader(s);
    if (!gl.getShaderParameter(s, gl.COMPILE_STATUS)) {
      console.error(gl.getShaderInfoLog(s));
      gl.deleteShader(s);
      return null;
    }
    return s;
  }

  function createProgram(vsSrc, fsSrc) {
    const vs = compile(gl.VERTEX_SHADER, vsSrc);
    const fs = compile(gl.FRAGMENT_SHADER, fsSrc);
    if (!vs || !fs) return null;
    const p = gl.createProgram();
    gl.attachShader(p, vs);
    gl.attachShader(p, fs);
    gl.linkProgram(p);
    if (!gl.getProgramParameter(p, gl.LINK_STATUS)) {
      console.error(gl.getProgramInfoLog(p));
      return null;
    }
    gl.deleteShader(vs);
    gl.deleteShader(fs);
    return p;
  }

  const program = createProgram(VERT_SRC, FRAG_SRC);
  if (!program) {
    document.body.innerHTML = '<div class="fallback">Failed to initialise the renderer.</div>';
    return;
  }

  gl.useProgram(program);

  const aPos    = gl.getAttribLocation(program, 'aPos');
  const uRot    = gl.getUniformLocation(program, 'uRot');
  const uTanFov = gl.getUniformLocation(program, 'uTanFov');
  const uAspect = gl.getUniformLocation(program, 'uAspect');
  const uTex    = gl.getUniformLocation(program, 'uTex');

  /* Fullscreen triangle */
  const quad = gl.createBuffer();
  gl.bindBuffer(gl.ARRAY_BUFFER, quad);
  gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1, -1, 3, -1, -1, 3]), gl.STATIC_DRAW);
  gl.enableVertexAttribArray(aPos);
  gl.vertexAttribPointer(aPos, 2, gl.FLOAT, false, 0, 0);

  gl.uniform1i(uTex, 0);

  /* Anisotropic filtering when available */
  const anisoExt = gl.getExtension('EXT_texture_filter_anisotropic')
                || gl.getExtension('WEBKIT_EXT_texture_filter_anisotropic')
                || gl.getExtension('MOZ_EXT_texture_filter_anisotropic');
  const MAX_ANISO = anisoExt ? gl.getParameter(anisoExt.MAX_TEXTURE_MAX_ANISOTROPY_EXT) : 1;

  /* =========================================================
     TEXTURE
     ========================================================= */
  let texture = null;

  function isPowerOfTwo(n) { return (n & (n - 1)) === 0; }

  function setTexture(source) {
    if (!texture) texture = gl.createTexture();

    gl.bindTexture(gl.TEXTURE_2D, texture);
    gl.pixelStorei(gl.UNPACK_FLIP_Y_WEBGL, false);
    gl.pixelStorei(gl.UNPACK_PREMULTIPLY_ALPHA_WEBGL, false);

    try {
      gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, gl.RGBA, gl.UNSIGNED_BYTE, source);
    } catch (err) {
      console.error(err);
      showToast('Image too large for this device');
      return;
    }

    const pot = isPowerOfTwo(source.width) && isPowerOfTwo(source.height);

    if (pot) {
      gl.generateMipmap(gl.TEXTURE_2D);
      gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.LINEAR_MIPMAP_LINEAR);
      gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.REPEAT);
    } else {
      gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.LINEAR);
      gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE);
    }

    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.LINEAR);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);

    if (anisoExt && MAX_ANISO > 1) {
      gl.texParameterf(gl.TEXTURE_2D, anisoExt.TEXTURE_MAX_ANISOTROPY_EXT, Math.min(8, MAX_ANISO));
    }
  }

  /* =========================================================
     CAMERA STATE
     ========================================================= */
  const FOV_MIN  = 0.50;   /* ~28.6° */
  const FOV_MAX  = 1.75;   /* ~100°  */
  const FOV_DEF  = 1.20;   /* ~68.8° */

  let yaw    = -Math.PI / 2;
  let pitch  = 0;
  let fov    = FOV_DEF;
  let targetFov = FOV_DEF;

  let velYaw = 0, velPitch = 0;
  let dragging = false;
  let lastX = 0, lastY = 0;

  let autoRotate = false;

  const rotMat = new Float32Array(9);

  function clamp(v, a, b) { return v < a ? a : (v > b ? b : v); }

  /* =========================================================
     RENDER LOOP
     ========================================================= */
  function resize() {
    const dpr = Math.min(window.devicePixelRatio || 1, 2);
    const w = Math.max(1, Math.floor(canvas.clientWidth * dpr));
    const h = Math.max(1, Math.floor(canvas.clientHeight * dpr));
    if (canvas.width !== w || canvas.height !== h) {
      canvas.width = w;
      canvas.height = h;
    }
  }

  let prevTime = performance.now();

  function frame(now) {
    const dt = Math.min((now - prevTime) / 1000, 0.1);
    prevTime = now;

    /* ---- smooth zoom ---- */
    fov += (targetFov - fov) * Math.min(dt * 12, 1);

    /* ---- inertia ---- */
    if (!dragging) {
      if (velYaw !== 0 || velPitch !== 0) {
        const k = Math.min(dt * 60, 2);
        yaw   += velYaw * k;
        pitch += velPitch * k;
        const damp = Math.pow(0.93, k);
        velYaw *= damp;
        velPitch *= damp;
        if (Math.abs(velYaw) < 1e-5) velYaw = 0;
        if (Math.abs(velPitch) < 1e-5) velPitch = 0;
      }
      if (autoRotate) yaw += 0.11 * dt * Math.PI;
    }

    pitch = clamp(pitch, -Math.PI / 2 + 0.001, Math.PI / 2 - 0.001);

    /* ---- draw ---- */
    resize();
    gl.viewport(0, 0, canvas.width, canvas.height);
    gl.clearColor(0.79, 0.83, 0.75, 1);
    gl.clear(gl.COLOR_BUFFER_BIT);

    /* Rotation matrix  R = Ry(yaw) * Rx(pitch)  (column-major) */
    const cy = Math.cos(yaw),  sy = Math.sin(yaw);
    const cp = Math.cos(pitch), sp = Math.sin(pitch);

    rotMat[0] = cy;       rotMat[1] = 0;   rotMat[2] = -sy;
    rotMat[3] = sy * sp;  rotMat[4] = cp;  rotMat[5] = cy * sp;
    rotMat[6] = sy * cp;  rotMat[7] = -sp; rotMat[8] = cy * cp;

    gl.activeTexture(gl.TEXTURE0);
    gl.bindTexture(gl.TEXTURE_2D, texture);
    gl.uniformMatrix3fv(uRot, false, rotMat);
    gl.uniform1f(uTanFov, Math.tan(fov / 2));
    gl.uniform1f(uAspect, canvas.width / canvas.height);

    gl.drawArrays(gl.TRIANGLES, 0, 3);

    requestAnimationFrame(frame);
  }

  /* =========================================================
     INTERACTION
     ========================================================= */
  function sensitivity() {
    return 0.0026 * (fov / FOV_DEF);
  }

  canvas.addEventListener('pointerdown', function (e) {
    dragging = true;
    lastX = e.clientX;
    lastY = e.clientY;
    velYaw = 0;
    velPitch = 0;
    canvas.classList.add('grabbing');
    if (canvas.setPointerCapture) canvas.setPointerCapture(e.pointerId);
    hideHint();
  });

  canvas.addEventListener('pointermove', function (e) {
    if (!dragging) return;
    const dx = e.clientX - lastX;
    const dy = e.clientY - lastY;
    lastX = e.clientX;
    lastY = e.clientY;

    const s = sensitivity();
    yaw   += dx * s;
    pitch += dy * s;

    velYaw   = dx * s;
    velPitch = dy * s;
  });

  function endDrag(e) {
    if (!dragging) return;
    dragging = false;
    canvas.classList.remove('grabbing');
    if (canvas.releasePointerCapture && e && e.pointerId !== undefined) {
      try { canvas.releasePointerCapture(e.pointerId); } catch (err) {}
    }
  }
  canvas.addEventListener('pointerup', endDrag);
  canvas.addEventListener('pointercancel', endDrag);
  canvas.addEventListener('pointerleave', function (e) {
    if (e.pointerType === 'mouse' && dragging) endDrag(e);
  });

  /* Zoom — wheel */
  canvas.addEventListener('wheel', function (e) {
    e.preventDefault();
    targetFov = clamp(targetFov * Math.exp(e.deltaY * 0.0012), FOV_MIN, FOV_MAX);
    hideHint();
  }, { passive: false });

  /* Zoom — pinch */
  let pinchStart = 0, pinchFov = 0;
  canvas.addEventListener('touchstart', function (e) {
    if (e.touches.length === 2) {
      const dx = e.touches[0].clientX - e.touches[1].clientX;
      const dy = e.touches[0].clientY - e.touches[1].clientY;
      pinchStart = Math.hypot(dx, dy);
      pinchFov = targetFov;
      dragging = false;
    }
  }, { passive: true });

  canvas.addEventListener('touchmove', function (e) {
    if (e.touches.length === 2 && pinchStart > 0) {
      e.preventDefault();
      const dx = e.touches[0].clientX - e.touches[1].clientX;
      const dy = e.touches[0].clientY - e.touches[1].clientY;
      const dist = Math.hypot(dx, dy);
      targetFov = clamp(pinchFov * (pinchStart / Math.max(dist, 1)), FOV_MIN, FOV_MAX);
    }
  }, { passive: false });

  canvas.addEventListener('touchend', function (e) {
    if (e.touches.length < 2) pinchStart = 0;
  });

  /* Keyboard */
  window.addEventListener('keydown', function (e) {
    const step = 0.09;
    switch (e.key) {
      case 'ArrowLeft':  yaw += step; break;
      case 'ArrowRight': yaw -= step; break;
      case 'ArrowUp':    pitch += step; break;
      case 'ArrowDown':  pitch -= step; break;
      case '+': case '=': targetFov = clamp(targetFov / 1.15, FOV_MIN, FOV_MAX); break;
      case '-': case '_': targetFov = clamp(targetFov * 1.15, FOV_MIN, FOV_MAX); break;
      case 'r': case 'R': resetView(); break;
      default: return;
    }
    hideHint();
  });

  /* =========================================================
     UI WIRING
     ========================================================= */
  const loader    = document.getElementById('loader');
  const toastEl   = document.getElementById('toast');
  const hintEl    = document.getElementById('hint');
  const btnAuto   = document.getElementById('btnAuto');

  let toastTimer = null;
  function showToast(msg) {
    toastEl.textContent = msg;
    toastEl.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function () { toastEl.classList.remove('show'); }, 2200);
  }

  function showLoader(on) {
    loader.classList.toggle('active', !!on);
  }

  let hintHidden = false;
  function hideHint() {
    if (hintHidden) return;
    hintHidden = true;
    hintEl.classList.add('hide');
  }
  setTimeout(hideHint, 7000);

  function resetView() {
    yaw = -Math.PI / 2;
    pitch = 0;
    velYaw = 0;
    velPitch = 0;
    targetFov = FOV_DEF;
  }

  document.getElementById('btnZoomIn').addEventListener('click', function () {
    targetFov = clamp(targetFov / 1.2, FOV_MIN, FOV_MAX);
    hideHint();
  });

  document.getElementById('btnZoomOut').addEventListener('click', function () {
    targetFov = clamp(targetFov * 1.2, FOV_MIN, FOV_MAX);
    hideHint();
  });

  btnAuto.addEventListener('click', function () {
    autoRotate = !autoRotate;
    btnAuto.classList.toggle('active', autoRotate);
    showToast(autoRotate ? 'Auto-rotate on' : 'Auto-rotate off');
    hideHint();
  });

  document.getElementById('btnReset').addEventListener('click', function () {
    resetView();
    showToast('View reset');
  });

  document.getElementById('btnFull').addEventListener('click', function () {
    if (!document.fullscreenElement) {
      const el = document.documentElement;
      const req = el.requestFullscreen || el.webkitRequestFullscreen || el.msRequestFullscreen;
      if (req) req.call(el);
    } else {
      const exit = document.exitFullscreen || document.webkitExitFullscreen || document.msExitFullscreen;
      if (exit) exit.call(document);
    }
  });

  /* =========================================================
     IMAGE LOADING – only img01.png
     ========================================================= */
  function prepareSource(img) {
    const maxSize = gl.getParameter(gl.MAX_TEXTURE_SIZE) || 4096;
    if (img.width <= maxSize && img.height <= maxSize) return img;

    const scale = Math.min(maxSize / img.width, maxSize / img.height);
    const c = document.createElement('canvas');
    c.width  = Math.max(1, Math.round(img.width  * scale));
    c.height = Math.max(1, Math.round(img.height * scale));
    c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
    return c;
  }

  /* =========================================================
     BOOT – load img01.png
     ========================================================= */
  const defaultImg = new Image();

  defaultImg.onload = function () {
    setTexture(prepareSource(defaultImg));
    resetView();
    showLoader(false);
    showToast('Loaded img01.png · ' + defaultImg.width + '×' + defaultImg.height);
  };

  defaultImg.onerror = function () {
    showLoader(false);
    showToast('Could not load img01.png – make sure it is in the same folder');
    console.warn('img01.png not found. Place it next to this HTML file.');
  };

  showLoader(true);
  defaultImg.src = 'img01.png';

  /* Start render loop */
  requestAnimationFrame(function (t) {
    prevTime = t;
    requestAnimationFrame(frame);
  });

})();
</script>
