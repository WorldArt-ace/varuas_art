<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pinterest Style Gallery</title>
    <!-- Google Fonts for professional typography -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        /* Base Reset & Styling */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Inter', sans-serif;
            background-color: #f7f7f7;
            color: #333;
            padding: 20px;
        }

        /* Header Styling */
        header {
            text-align: center;
            margin-bottom: 40px;
            padding-top: 20px;
        }

        header h1 {
            font-size: 2.5rem;
            font-weight: 700;
            margin-bottom: 10px;
        }

        header p {
            color: #767676;
            font-size: 1.1rem;
        }

        /* 
         * MASONRY LAYOUT CORE 
         * Uses CSS multi-column layout for the Pinterest effect
         */
        .masonry-grid {
            column-count: 4; /* Default number of columns for desktop */
            column-gap: 20px; /* Space between columns */
            max-width: 1400px;
            margin: 0 auto; /* Centers the grid */
        }

        /* Individual Photo Cards */
        .masonry-item {
            break-inside: avoid; /* Prevents images from splitting across columns */
            margin-bottom: 20px; /* Space below each image */
            position: relative;
            border-radius: 16px;
            overflow: hidden;
            cursor: zoom-in;
            background-color: #eee; /* Placeholder color before image loads */
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.05);
        }

        .masonry-item img {
            width: 100%;
            display: block;
            border-radius: 16px;
            transition: transform 0.3s ease, filter 0.3s ease;
        }

        /* Hover Effects */
        .masonry-item:hover img {
            filter: brightness(0.75); /* Darkens the image slightly */
            transform: scale(1.02); /* Slight zoom effect */
        }

        /* Overlay UI (Save Button & Title) */
        .item-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            padding: 16px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            opacity: 0;
            transition: opacity 0.3s ease;
            pointer-events: none; /* Prevents overlay from blocking clicks initially */
        }

        .masonry-item:hover .item-overlay {
            opacity: 1;
            pointer-events: auto;
        }

        /* Pinterest-style "Save" Button */
        .save-btn {
            align-self: flex-end;
            background-color: #e60023;
            color: white;
            border: none;
            padding: 10px 16px;
            border-radius: 24px;
            font-weight: 600;
            font-size: 0.9rem;
            cursor: pointer;
            transition: background-color 0.2s;
        }

        .save-btn:hover {
            background-color: #ad081b;
        }

        /* Bottom Text */
        .item-title {
            color: white;
            font-weight: 600;
            text-shadow: 0 1px 4px rgba(0,0,0,0.5);
            margin-top: auto;
        }

        /* 
         * RESPONSIVE DESIGN 
         * Adjusts column count based on screen width
         */
        @media (max-width: 1200px) {
            .masonry-grid { column-count: 3; }
        }

        @media (max-width: 900px) {
            .masonry-grid { column-count: 2; }
        }

        @media (max-width: 500px) {
            .masonry-grid { 
                column-count: 1; 
                padding: 0 10px;
            }
        }
    </style>
</head>
<body>

    <header>
        <h1>Inspiration Board</h1>
        <p>Discover beautiful, high-quality photography</p>
    </header>

    <main class="masonry-grid">
